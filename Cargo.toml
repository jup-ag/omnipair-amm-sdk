[package]
name = "omnipair-amm-sdk"
version = "0.1.0"
edition = "2021"
description = "SDK for interacting with Omnipair AMM, built for Jupiter"
license = "MIT"
repository = "https://github.com/omnipair/omnipair-amm-sdk"

[dependencies]
anchor-lang = "1.0.0"
anyhow = "1"
borsh = "1"
jupiter-amm-interface = { version = ">=1.0.0-beta.0, <2" }
rust_decimal = "1.26.1"

[dev-dependencies]
solana-account = "3"
solana-rpc-client = "3"
solana-commitment-config = "3"
ahash = "0.8.12"
